<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Режим</title>
<meta name="description" content="Расписание дня, отметки привычек и итоги недели и месяца">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Режим">
<meta name="theme-color" content="#111215">
<meta name="color-scheme" content="dark">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<style>
/* Только тёмная тема */
:root {
  --bg: #111215; --card: #1B1C20; --sheet: #1E1F24; --field: #232429; --track: #222328; --line: #2C2E33;
  --ink: #EDECE8; --ink2: #CFCEC9; --muted: #9A9CA4; --ring: #5E6067; --skip: #3A3C43;
  --acc: #86A8F0; --on-acc: #0D1630; --link: #9AB6F3;
  --acc-soft: #1C2539; --acc-soft2: #22304C; --acc-line: #2F3F63; --acc-text: #C6D6F8;
  --min: #4A68A8; --min-line: #5674AE;
  --warn: #E9C489; --warn-bg: #33291A;
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--ink); }
body {
  font: 16px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
  padding: 0 0 calc(64px + env(safe-area-inset-bottom));
  -webkit-text-size-adjust: 100%;
}
body.lock { overflow: hidden; }
main { max-width: 560px; margin: 0 auto; padding: calc(env(safe-area-inset-top) + 18px) 16px 28px; }
button, select, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
.ic { flex: none; display: block; }
.muted { color: var(--muted); }
h1 { margin: 2px 0 0; font-size: 32px; line-height: 1.1; font-weight: 700; letter-spacing: -0.02em; }
.sec { margin: 30px 4px 0; display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.sec h2 { margin: 0; font-size: 20px; font-weight: 700; letter-spacing: -0.01em; }
.sec .cnt { font-size: 15px; color: var(--muted); font-variant-numeric: tabular-nums; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; }
.segbar { margin: 10px 4px 12px; display: grid; gap: 4px; }
.segbar span { height: 4px; border-radius: 2px; background: var(--track); }
.segbar span.on { background: var(--acc); }
.note-s { font-size: 13px; color: var(--muted); margin: 10px 4px 0; line-height: 1.4; }

/* шапка дня */
.top { display: flex; align-items: flex-end; gap: 8px; }
.top .tt { flex: 1; min-width: 0; }
.kicker { font-size: 14px; color: var(--muted); }
.kicker b { color: var(--link); font-weight: 600; }
.nbtn { width: 44px; height: 44px; flex: none; border-radius: 14px; border: 1px solid var(--line); background: var(--card);
  display: flex; align-items: center; justify-content: center; padding: 0; color: var(--ink); }
.chips { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
.pill { position: relative; height: 44px; padding: 0 14px; border-radius: 22px; display: inline-flex; align-items: center; gap: 8px;
  font-size: 15px; font-weight: 500; border: 1px solid var(--line); background: var(--card); color: var(--ink); }
.pill .ic.acc { color: var(--acc); }
.pill .ic.mut { color: var(--muted); }
.pill select { position: absolute; inset: 0; width: 100%; opacity: 0; font-size: 16px; }
.pill.sw { padding-right: 10px; }
.knob { width: 34px; height: 20px; border-radius: 10px; background: var(--ring); position: relative; flex: none; transition: background .15s; }
.knob::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff;
  box-shadow: 0 1px 2px rgba(0,0,0,.25); transition: transform .15s; }
.pill[aria-checked="true"] { border-color: var(--acc-line); background: var(--acc-soft); }
.pill[aria-checked="true"] .knob { background: var(--acc); }
.pill[aria-checked="true"] .knob::after { transform: translateX(14px); }
.linkbtn { border: 0; background: none; color: var(--link); padding: 0 6px; font-size: 15px; font-weight: 600; height: 44px; }

/* баннеры */
.banner { margin-top: 16px; display: flex; align-items: center; gap: 12px; padding: 8px 8px 8px 14px; background: var(--card); border: 1px solid var(--line); border-radius: 16px; }
.banner > span { flex: 1; font-size: 15px; line-height: 1.3; }
.banner .ic { color: var(--link); }
.softbtn { height: 44px; padding: 0 16px; border-radius: 12px; border: 0; background: var(--acc-soft2); color: var(--link); font-weight: 600; font-size: 15px; }
.hint { margin-top: 12px; display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; background: var(--acc-soft2); color: var(--acc-text); border-radius: 14px; font-size: 14px; line-height: 1.4; }
.hint .ic { margin-top: 1px; }

/* карточка «Сейчас» */
.now { margin-top: 16px; padding: 18px; background: var(--acc-soft); border: 1px solid var(--acc-line); border-radius: 22px; display: flex; flex-direction: column; gap: 14px; }
.now .nh { display: flex; align-items: center; justify-content: space-between; }
.badge { display: inline-flex; align-items: center; height: 26px; padding: 0 10px; border-radius: 13px; background: var(--acc); color: var(--on-acc);
  font-size: 12px; font-weight: 700; letter-spacing: .06em; }
.badge.sm { height: 20px; padding: 0 8px; border-radius: 10px; font-size: 11px; letter-spacing: .05em; }
.eta { display: inline-flex; align-items: center; gap: 5px; font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
.now .nt { display: flex; align-items: center; gap: 10px; }
.now .nt .ic { color: var(--link); }
.now h2 { margin: 0; font-size: 24px; line-height: 1.2; font-weight: 700; letter-spacing: -0.01em; }
.now .nn { margin: 6px 0 0; display: flex; align-items: center; gap: 6px; font-size: 15px; color: var(--ink2); }
.now .nn.light { color: var(--acc-text); }
.now .np { display: flex; align-items: center; gap: 10px; }
.now .np > span:first-child { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; flex: none; }
.now .track { flex: 1; height: 4px; border-radius: 2px; background: var(--acc-line); overflow: hidden; }
.now .track i { display: block; height: 100%; background: var(--acc); }
.bigbtn { height: 56px; border: 0; border-radius: 16px; background: var(--acc); color: var(--on-acc); font-size: 17px; font-weight: 600;
  display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; }
.now .then { font-size: 14px; color: var(--muted); }
.now .then span { color: var(--ink2); }
.alldone { margin-top: 16px; padding: 18px; display: flex; align-items: center; gap: 14px; background: var(--acc-soft); border: 1px solid var(--acc-line); border-radius: 22px; }
.alldone .moon { width: 48px; height: 48px; border-radius: 50%; background: var(--acc); color: var(--on-acc); display: flex; align-items: center; justify-content: center; flex: none; }
.alldone b { display: block; font-size: 18px; }
.alldone span { color: var(--ink2); font-size: 15px; }

/* группы и строки плана */
.grpc { width: 100%; margin-top: 10px; display: flex; align-items: center; gap: 12px; padding: 12px 14px 12px 16px; min-height: 64px;
  background: var(--card); border: 1px solid var(--line); border-radius: 18px; text-align: left; color: var(--ink); }
.grpc .gt { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.grpc .gt b { font-size: 16px; font-weight: 600; }
.grpc .gt b span { font-weight: 400; color: var(--muted); }
.grpc .gt > span { font-size: 14px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cnt2 { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
.grpc .ic, .grph .ic { color: var(--muted); }
.dotc { width: 26px; height: 26px; border-radius: 50%; flex: none; display: flex; align-items: center; justify-content: center; box-shadow: inset 0 0 0 2px var(--ring); }
.dotc.on { background: var(--acc); box-shadow: none; color: var(--on-acc); }
.grp { margin-top: 10px; overflow: hidden; }
.grph { width: 100%; display: flex; align-items: center; gap: 10px; padding: 0 14px 0 16px; height: 52px; background: none; border: 0; text-align: left; color: var(--ink); }
.grph b { font-size: 16px; }
.grph .rng { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
.row { display: grid; grid-template-columns: 48px minmax(0, 1fr); padding: 8px 14px 12px 6px; border-top: 1px solid var(--line); }
.row.now { background: var(--acc-soft); }
.row.past:not(.done) .rbody { opacity: .55; }
.chk { width: 48px; height: 48px; padding: 0; border: 0; background: none; display: flex; align-items: center; justify-content: center; }
.chk .c { width: 28px; height: 28px; border-radius: 50%; box-shadow: inset 0 0 0 2px var(--ring); display: flex; align-items: center; justify-content: center; color: var(--on-acc);
  transition: transform .15s, background .15s; }
.row.now .chk .c { box-shadow: inset 0 0 0 2px var(--acc); }
.chk[aria-pressed="true"] .c { background: var(--acc); box-shadow: none; }
.chk.pop .c { animation: pop .28s ease-out; }
@keyframes pop { 0% { transform: scale(.7); } 60% { transform: scale(1.15); } 100% { transform: scale(1); } }
.chk:disabled { opacity: .35; }
.rb { min-width: 0; padding-top: 5px; }
.rbody { display: block; width: 100%; padding: 0; border: 0; background: none; text-align: left; color: var(--ink); }
.rt { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.rtitle { display: flex; align-items: center; gap: 8px; margin-top: 2px; font-size: 16px; font-weight: 600; line-height: 1.3; }
.rtitle .ic { color: var(--muted); }
.row.done .rtitle { color: var(--muted); }
.rhint { display: flex; align-items: flex-start; gap: 6px; margin-top: 3px; font-size: 14px; line-height: 1.35; color: var(--muted); }
.rhint.light { color: var(--acc-text); }
.rhint .ic { margin-top: 1px; }
.npill { display: inline-flex; align-items: center; gap: 6px; margin-top: 8px; padding: 6px 10px; border-radius: 10px; background: var(--field); font-size: 14px; line-height: 1.3; color: var(--ink2); max-width: 100%; }
.npill span { overflow-wrap: anywhere; }
.addnote { display: inline-flex; align-items: center; gap: 4px; margin-top: 6px; font-size: 14px; font-weight: 500; color: var(--link); }
.plink { display: inline-flex; align-items: center; gap: 2px; min-height: 40px; margin-top: 2px; font-size: 14px; font-weight: 600; color: var(--link); background: none; border: 0; padding: 0; }
.noteed { display: block; width: 100%; margin-top: 10px; min-height: 70px; padding: 10px 12px; border: 1.5px solid var(--acc); border-radius: 12px;
  background: var(--field); color: var(--ink); font-size: 16px; line-height: 1.35; resize: none; outline: none; }
.saved { display: block; margin-top: 6px; font-size: 12px; color: var(--muted); }

/* привычки */
.habs { margin-top: 10px; padding: 0 14px; }
.hab { padding: 14px 0; }
.hab + .hab { border-top: 1px solid var(--line); }
.habh { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
.habh .ic { color: var(--muted); }
.habh .hn { font-size: 16px; font-weight: 600; flex: 1; }
.habh .hs { font-size: 13px; color: var(--muted); }
.habh .hs.on { color: var(--link); }
.opts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.opt { min-height: 56px; padding: 6px 4px; border-radius: 12px; border: 1px solid var(--line); background: transparent; color: var(--ink);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; line-height: 1.2; }
.opt b { font-size: 15px; font-weight: 600; }
.opt small { font-size: 12px; color: var(--muted); }
.opt[aria-pressed="true"][data-v="done"] { background: var(--acc); border-color: var(--acc); color: var(--on-acc); }
.opt[aria-pressed="true"][data-v="done"] small { color: var(--on-acc); }
.opt[aria-pressed="true"][data-v="min"] { background: var(--acc-soft2); border-color: var(--min-line); color: var(--acc-text); }
.opt[aria-pressed="true"][data-v="min"] small { color: var(--acc-text); }
.opt[aria-pressed="true"][data-v="skip"] { background: var(--skip); border-color: var(--skip); }
.opt:disabled { opacity: .45; }

/* итог дня */
.sumcard { margin-top: 30px; display: flex; flex-direction: column; gap: 14px; padding: 16px; width: 100%; text-align: left; color: var(--ink); }
.sumcard .sh { display: flex; align-items: center; justify-content: space-between; }
.sumcard .sh b { font-size: 20px; letter-spacing: -0.01em; }
.sumcard .sh span { display: inline-flex; align-items: center; gap: 2px; font-size: 15px; font-weight: 600; color: var(--link); }
.tiles { display: grid; gap: 6px; }
.tile { display: flex; flex-direction: column; gap: 2px; padding: 10px 8px; border-radius: 12px; background: var(--field); min-width: 0; }
.tile b { font-size: 15px; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tile b.no { color: var(--muted); }
.tile span { font-size: 12px; color: var(--muted); }

.shade { position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 20; animation: fade .2s; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; top: calc(env(safe-area-inset-top) + 40px); max-width: 560px; margin: 0 auto; z-index: 21;
  background: var(--sheet); border-radius: 24px 24px 0 0; padding: 8px 16px calc(16px + env(safe-area-inset-bottom));
  display: flex; flex-direction: column; animation: up .25s ease-out; }
@keyframes fade { from { opacity: 0; } }
@keyframes up { from { transform: translateY(40px); opacity: 0; } }
.sheet .grab { display: block; width: 36px; height: 5px; border-radius: 3px; background: var(--ring); margin: 0 auto 14px; flex: none; }
.sheet .shh { display: flex; align-items: flex-start; gap: 12px; flex: none; }
.sheet .shh div { flex: 1; min-width: 0; }
.sheet h2 { margin: 0; font-size: 24px; font-weight: 700; letter-spacing: -0.01em; }
.sheet .sub { margin-top: 2px; font-size: 14px; color: var(--muted); }
.xbtn { width: 44px; height: 44px; border-radius: 50%; border: 0; background: var(--field); display: flex; align-items: center; justify-content: center; padding: 0; flex: none; }
.sheet .scroll { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; margin: 0 -16px; padding: 0 16px 12px; }
.slist { margin-top: 18px; background: var(--field); border-radius: 16px; }
.slist div { display: flex; align-items: center; gap: 10px; min-height: 48px; padding: 0 14px; }
.slist div + div { border-top: 1px solid var(--line); }
.slist .ic { color: var(--muted); }
.slist span { flex: 1; font-size: 15px; }
.slist b { display: inline-flex; align-items: center; gap: 7px; font-size: 15px; font-variant-numeric: tabular-nums; }
.slist b i { width: 8px; height: 8px; border-radius: 50%; display: block; }
.slist b.no { color: var(--muted); font-weight: 500; }
.sheet h3 { margin: 22px 2px 2px; font-size: 15px; font-weight: 700; }
.sheet ul { margin: 0; padding: 0 2px; list-style: none; }
.sheet li { padding: 10px 0; border-top: 1px solid var(--line); font-size: 15px; line-height: 1.4; overflow-wrap: anywhere; }
.sheet li span { display: block; font-size: 13px; color: var(--muted); }
.sheet label { display: block; margin: 16px 2px 6px; font-size: 15px; font-weight: 700; }
.ta { display: block; width: 100%; min-height: 88px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--field);
  color: var(--ink); font-size: 16px; line-height: 1.4; resize: none; }
.sheet .bigbtn { flex: none; margin-top: 10px; }

/* тренировка */
.seg { margin-top: 16px; display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px; padding: 4px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; }
.seg button { height: 40px; border: 0; border-radius: 10px; background: transparent; color: var(--muted); font-size: 15px; font-weight: 500;
  display: flex; align-items: center; justify-content: center; gap: 6px; }
.seg button[aria-pressed="true"] { background: var(--skip); color: var(--ink); font-weight: 600; }
.exs { margin-top: 0; overflow: hidden; }
.ex { display: grid; grid-template-columns: 48px minmax(0, 1fr); padding: 8px 14px 12px 6px; }
.ex + .ex { border-top: 1px solid var(--line); }
.ex .eh { display: flex; align-items: baseline; gap: 10px; padding-top: 12px; }
.ex .eh b { flex: 1; font-size: 16px; font-weight: 600; line-height: 1.3; }
.ex.done .eh b { color: var(--muted); }
.ex .eh span { font-size: 14px; color: var(--muted); white-space: nowrap; }
.ex input { display: block; width: 100%; margin-top: 8px; height: 40px; padding: 0 10px; border: 1px solid transparent; border-radius: 10px;
  background: var(--field); color: var(--ink); font-size: 16px; outline: none; }
.ex input:focus { border-color: var(--acc); }
.ex input::placeholder, .ta::placeholder, .noteed::placeholder, .fld::placeholder { color: #6C6E75; }
.secbtn { margin-top: 12px; width: 100%; height: 48px; border-radius: 14px; border: 1px solid var(--line); background: var(--card); color: var(--ink);
  font-size: 15px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px; }
.empty { margin-top: 0; padding: 26px 18px 18px; text-align: center; }
.empty .eic { width: 52px; height: 52px; margin: 0 auto 12px; border-radius: 50%; background: var(--acc-soft2); color: var(--link); display: flex; align-items: center; justify-content: center; }
.empty b { display: block; font-size: 18px; }
.empty p { margin: 6px 0 16px; font-size: 14px; color: var(--muted); line-height: 1.4; }
.edrow { display: grid; grid-template-columns: 22px minmax(0, 1fr) 44px; gap: 8px 6px; align-items: center; padding: 12px 8px 12px 10px; }
.edrow + .edrow { border-top: 1px solid var(--line); }
.edrow .num { font-size: 13px; color: var(--muted); text-align: center; }
.edrow .fld2 { grid-column: 2; }
.fld { width: 100%; height: 44px; padding: 0 12px; border: 1px solid transparent; border-radius: 10px; background: var(--field); color: var(--ink); font-size: 16px; outline: none; }
.fld:focus { border-color: var(--acc); }
.fld.b { font-weight: 600; }
.xs { width: 44px; height: 44px; border: 0; background: none; color: var(--muted); display: flex; align-items: center; justify-content: center; padding: 0; }
.dashed { margin-top: 12px; width: 100%; height: 48px; border-radius: 14px; border: 1.5px dashed var(--line); background: transparent; color: var(--link);
  font-size: 15px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 6px; }
.savebar { position: fixed; left: 0; right: 0; bottom: calc(57px + env(safe-area-inset-bottom)); z-index: 6; background: var(--bg); border-top: 1px solid var(--line);
  padding: 10px 16px; display: grid; grid-template-columns: 1fr 2fr; gap: 8px; }
.savebar button { height: 48px; border-radius: 14px; font-size: 16px; font-weight: 600; }
.savebar .cancel { border: 1px solid var(--line); background: var(--card); color: var(--ink); }
.savebar .ok { border: 0; background: var(--acc); color: var(--on-acc); }
.pad-save { height: 70px; }

/* итоги */
.lead { margin: 8px 0 0; font-size: 15px; line-height: 1.4; color: var(--muted); }
.pcard { margin-top: 10px; padding: 12px 14px 4px; }
.pcard.m { padding-bottom: 16px; }
.pnav { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
.pnav span { flex: 1; text-align: center; font-size: 16px; font-weight: 600; }
.st { padding: 12px 0; }
.st + .st { border-top: 1px solid var(--line); }
.sth { display: flex; align-items: center; gap: 8px; }
.sth .ic { color: var(--muted); }
.sth span { flex: 1; font-size: 15px; }
.sth b { font-size: 16px; font-variant-numeric: tabular-nums; }
.sth b small { font-size: 16px; font-weight: 400; color: var(--muted); }
.bar { margin-top: 8px; height: 8px; border-radius: 4px; background: var(--track); overflow: hidden; display: flex; }
.bar i { display: block; height: 100%; }
.bar .d { background: var(--acc); } .bar .m { background: var(--min); }
.sx { margin-top: 6px; font-size: 13px; color: var(--muted); }
.cal { margin-top: 8px; padding-top: 16px; border-top: 1px solid var(--line); display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.cal .wd { text-align: center; font-size: 12px; color: var(--muted); padding-bottom: 2px; }
.cell { height: 52px; padding: 0; border-radius: 12px; border: 1px solid var(--line); background: var(--card); display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 6px; color: var(--ink); }
.cell b { font-size: 14px; font-weight: 500; font-variant-numeric: tabular-nums; }
.cell.today { border: 2px solid var(--acc); }
.cell.today b { font-weight: 700; color: var(--link); }
.cell.future { opacity: .4; }
.dots { display: flex; gap: 3px; }
.dot { width: 7px; height: 7px; border-radius: 50%; display: block; box-shadow: inset 0 0 0 1.5px var(--ring); }
.dot.done { background: var(--acc); box-shadow: none; }
.dot.min { background: var(--min); box-shadow: none; }
.dot.skip { background: var(--skip); box-shadow: inset 0 0 0 1px var(--ring); }

.wrow { display: flex; align-items: center; justify-content: space-between; min-height: 52px; }
.wrow + .wrow { border-top: 1px solid var(--line); }

.wsel .ic.acc { color: var(--link); }

.trow { padding: 12px 0; }

.trow .tm { display: flex; align-items: center; gap: 8px; }
.trow .tm .dash { color: var(--muted); }
.trow input[type="time"] { width: 112px; height: 44px; padding: 0 10px; border: 1px solid transparent; border-radius: 10px; background: var(--field); color: var(--ink); font-size: 16px; }
.trow .tm .xs { margin-left: auto; }
.trow .fld { margin-top: 8px; }
.warn { margin-top: 12px; display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: 14px; background: var(--warn-bg); color: var(--warn); font-size: 14px; line-height: 1.4; }
.btn2 { margin-top: 10px; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.btn2 button { height: 48px; border-radius: 14px; font-size: 15px; font-weight: 600; }
.btn2 .plain { border: 0; background: transparent; color: var(--ink); }
.btn2 .ok { border: 0; background: var(--acc); color: var(--on-acc); }
.bcard { margin-top: 10px; padding: 14px; }
.bcard p { margin: 0 0 12px; font-size: 15px; line-height: 1.4; }
.bcard .bigbtn { height: 50px; font-size: 16px; }
.bcard .secbtn { margin-top: 8px; border: 0; background: transparent; }

/* таб-бар */
nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr));
  background: var(--card); border-top: 1px solid var(--line); padding: 6px 4px env(safe-area-inset-bottom); }
nav.tabs button { height: 50px; border: 0; background: none; padding: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 3px; font-size: 11px; font-weight: 500; color: var(--muted); }
nav.tabs button[aria-current="page"] { color: var(--link); font-weight: 600; }

/* сообщение после отметки */
.toast { position: fixed; left: 16px; right: 16px; max-width: 528px; margin: 0 auto; bottom: calc(72px + env(safe-area-inset-bottom)); z-index: 30;

.toast.show { opacity: 1; transform: none; }
.toast .ic { margin-top: 2px; }
.toast b { display: block; font-size: 15px; }
.toast span { font-size: 14px; color: #3A3C42; }
</style>

const TABS = { today: ["listChecks", "Сегодня"], train: ["dumbbell", "Тренировка"], stats: ["chart", "Итоги"], settings: ["sliders", "Настройки"] };
function render() {
  document.querySelectorAll("nav.tabs button").forEach(b => {
    const [icn, label] = TABS[b.dataset.tab], cur = b.dataset.tab === tab;
    b.setAttribute("aria-current", cur ? "page" : "false");

function dayHeader(k) {

  return `<header>
    <div class="top">

      <button class="nbtn" data-act="prev" aria-label="Предыдущий день">${ic("chevL", 20)}</button>

        <select id="planSel" aria-label="Тип дня">${Object.entries(state.templates).map(([id, t]) =>
          `<option value="${id}" ${id === plan ? "selected" : ""}>${esc(t.name)}</option>`).join("")}</select></label>

}

// следующий неотмеченный пункт: после указанного или по текущему времени
function nextBlock(k, afterId) {
  const bl = blocksOf(k);
  if (afterId) {
    const i = bl.findIndex(b => b.id === afterId);
    return bl.slice(i + 1).find(b => !blockDone(k, b.id)) || null;
  }
  const n = nowMin();
  return bl.find(b => !blockDone(k, b.id) && span(b)[1] > n) || null;
}
function groupsOf(blocks) {
  return [["Утро", 0, 600], ["День", 600, 1140], ["Вечер", 1140, 99999]]
    .map(([name, a, b]) => ({ name, blocks: blocks.filter(x => { const s = shiftMin(x.s); return s >= a && s < b; }) }))
    .filter(g => g.blocks.length);
}
const segbar = (done, total) => total ? `<div class="segbar" aria-hidden="true" style="grid-template-columns:repeat(${total},minmax(0,1fr))">${
  Array.from({ length: total }, (_, i) => `<span class="${i < done ? "on" : ""}"></span>`).join("")}</div>` : "";

function nowCard(k, light) {
  const nb = nextBlock(k), n = nowMin();
  if (!nb) {
    const bl = blocksOf(k), done = bl.filter(b => blockDone(k, b.id)).length;
    return done === bl.length
      ? `<div class="alldone"><span class="moon">${ic("moon", 24)}</span><div><b>Всё отмечено</b><span>Спокойной ночи</span></div></div>`
      : `<div class="alldone"><span class="moon">${ic("moon", 24)}</span><div><b>День закончился</b><span>Отмечено ${done} из ${bl.length}. Пропущенное можно отметить ниже.</span></div></div>`;
  }
  const [s, e] = span(nb), cur = n >= s && n < e;
  const after = nextBlock(k, nb.id);
  const hint = light && nb.l ? `<p class="nn light">${ic("feather", 16)}${esc(nb.l)}</p>` : nb.n ? `<p class="nn">${esc(nb.n)}</p>` : "";
  const pct = cur ? Math.round((n - s) / (e - s) * 100) : 0;
  return `<section class="now" aria-label="${cur ? "Сейчас" : "Дальше"}">
    <div class="nh"><span class="badge">${cur ? "СЕЙЧАС" : "ДАЛЬШЕ"}</span>
      <span class="eta">${ic("clock", 15)}${cur ? `ещё ${fmtDur(e - n)}` : n < s ? `через ${fmtDur(s - n)}` : "пора отметить"}</span></div>
    <div><div class="nt">${ic(blockIcon(nb.t), 26)}<h2>${esc(cleanTitle(nb.t))}</h2></div>${hint}</div>
    <div class="np"><span>${nb.s}–${nb.e}</span><span class="track"><i style="width:${pct}%"></i></span></div>
    <button class="bigbtn" data-act="blk" data-id="${nb.id}">${ic("check", 22, "", 2.5)}Готово</button>
    ${after ? `<div class="then">Потом: <span>${after.s} · ${esc(cleanTitle(after.t))}</span></div>` : ""}
  </section>`;
}

function blockRow(k, b, light, isToday, isFuture, plan) {
  const st = (mark(k).blocks || {})[b.id] || {}, n = nowMin(), [s, e] = span(b), open = openBlock === b.id;
  const cur = isToday && n >= s && n < e, past = isToday && n >= e;
  const hint = light && b.l ? `<span class="rhint light">${ic("feather", 15)}<span>${esc(b.l)}</span></span>` : b.n ? `<span class="rhint">${esc(b.n)}</span>` : "";
  const note = !open && st.n ? `<span class="npill">${ic("pencil", 14)}<span>${esc(st.n)}</span></span>`
    : !open && !isFuture ? `<span class="addnote">${ic("plus", 15)}Заметка</span>` : "";
  const prog = b.h === "tr" && state.programs[plan];
  return `<div class="row ${cur ? "now" : ""} ${past ? "past" : ""} ${st.d ? "done" : ""}">
    <button class="chk ${popId === b.id ? "pop" : ""}" data-act="blk" data-id="${b.id}" aria-pressed="${!!st.d}" aria-label="Отметить: ${esc(cleanTitle(b.t))}" ${isFuture ? "disabled" : ""}>
      <span class="c">${st.d ? ic("check", 16, "", 3) : ""}</span></button>
    <div class="rb">
      <button class="rbody" data-act="open" data-id="${b.id}" aria-label="${esc(cleanTitle(b.t))}: заметка">
        <span class="rt">${b.s}–${b.e}${cur ? `<span class="badge sm">СЕЙЧАС</span>` : ""}</span>
        <span class="rtitle">${ic(blockIcon(b.t), 18)}<span>${esc(cleanTitle(b.t))}</span></span>
        ${hint}${note}
      </button>
      ${prog ? `<button class="plink" data-act="goTrain">Программа тренировки${ic("chevR", 16)}</button>` : ""}
      ${open ? `<textarea class="noteed" data-note="b:${b.id}" rows="2" placeholder="Например: встал в 9:20, выспался">${esc(st.n)}</textarea><span class="saved">Сохраняется само</span>` : ""}
    </div>
  </div>`;
}

function dayData(k) {
  const plan = planOf(k), m = mark(k), bm = m.blocks || {}, em = m.ex || {};
  const blocks = state.templates[plan].blocks;
  const prog = state.programs[plan];
  const exItems = prog ? prog.items : [];
  return {
    plan, m, blocks, exItems,
    bDone: blocks.filter(b => bm[b.id]?.d).length,
    exDone: exItems.filter(x => em[x.id]?.d).length,
    bNotes: blocks.filter(b => bm[b.id]?.n).map(b => [cleanTitle(b.t), bm[b.id].n]),
    exNotes: exItems.filter(x => em[x.id]?.n).map(x => [x.n, em[x.id].n])
  };
}
const habitLabel = (h, v, plan) => { const def = habitDef(h, plan); return v && def ? optLabel(def.opts[v]) : "—"; };

function sheetHtml(k) {
  const r = dayData(k), dotc = { done: "var(--acc)", min: "var(--min)", skip: "var(--ring)" };
  const rows = [["listChecks", "Пункты плана", `<b>${r.bDone} из ${r.blocks.length}</b>`]];
  if (r.exItems.length) rows.push([TYPE_ICON[r.plan], "Упражнения", `<b>${r.exDone} из ${r.exItems.length}</b>`]);
  ["py", ...(HABITS.tr[r.plan] ? ["tr"] : []), "off"].forEach(h => {
    const def = habitDef(h, r.plan), v = r.m[h];
    rows.push([def.icon, def.short || def.name, v ? `<b><i style="background:${dotc[v]}"></i>${esc(optLabel(def.opts[v]))}</b>` : `<b class="no">не отмечено</b>`]);
  });
  const notes = [...r.bNotes, ...r.exNotes];
  return `<div class="shade" data-act="sheetClose"></div>
  <section class="sheet" role="dialog" aria-label="Итог дня">

      <label for="daynote">Заметка дня</label>
      <textarea id="daynote" class="ta" data-note="d:" rows="3" placeholder="Как прошёл день, что получилось, что мешало">${esc(r.m.note)}</textarea>
    </div>
    <button class="bigbtn" data-act="share">${ic("share", 20)}Поделиться отчётом</button>
  </section>`;
}

function reportText(k) {
  const r = dayData(k), bm = r.m.blocks || {}, em = r.m.ex || {};
  const L = [`Режим · ${dayTitle(k)} (${state.templates[r.plan].name})`, "", `План: ${r.bDone} из ${r.blocks.length}`];
  r.blocks.forEach(b => L.push(`${bm[b.id]?.d ? "✅" : "▫️"} ${b.s} ${cleanTitle(b.t)}${bm[b.id]?.n ? " — " + bm[b.id].n : ""}`));
  if (r.exItems.length) {
    L.push("", `Тренировка: ${r.exDone} из ${r.exItems.length}`);
    r.exItems.forEach(x => L.push(`${em[x.id]?.d ? "✅" : "▫️"} ${x.n} (${x.t})${em[x.id]?.n ? " — " + em[x.id].n : ""}`));
  }
  L.push("", `Python: ${habitLabel("py", r.m.py)}`);
  if (HABITS.tr[r.plan]) L.push(`Тренировка: ${habitLabel("tr", r.m.tr, r.plan)}`);
  L.push(`Отход от компьютера: ${habitLabel("off", r.m.off)}`);
  if (r.m.light) L.push("Лёгкий день");
  if (r.m.note) L.push("", `Заметка: ${r.m.note}`);
  return L.join("\n");
}

function countPeriod(from, to) {
  const tk = todayKey();
  const r = { days: 0, py: 0, pyMin: 0, gym: 0, gymMin: 0, gymPlan: 0, press: 0, pressMin: 0, pressPlan: 0, off: 0, offMin: 0, bDays: 0, bDone: 0, bTotal: 0, ex: 0 };
  for (let d = new Date(from); keyOf(d) <= keyOf(to) && keyOf(d) <= tk; d = addDays(d, 1)) {
    const k = keyOf(d), m = mark(k), p = planOf(k);
    r.days++;
    if (m.py === "done" || m.py === "min") r.py++;
    if (m.py === "min") r.pyMin++;
    const tr = m.tr === "done" || m.tr === "min";
    if (p === "gym") { r.gymPlan++; if (tr) r.gym++; if (m.tr === "min") r.gymMin++; }
    if (p === "press") { r.pressPlan++; if (tr) r.press++; if (m.tr === "min") r.pressMin++; }
    if (m.off === "done") r.off++;
    if (m.off === "min") r.offMin++;
    const dd = dayData(k);
    if (dd.bDone) { r.bDays++; r.bDone += dd.bDone; r.bTotal += dd.blocks.length; }
    r.ex += Object.values(m.ex || {}).filter(x => x.d).length;
  }
  return r;
}
function statRow(icn, label, done, min, total, extra) {
  const pd = total ? (done - min) / total * 100 : 0, pm = total ? min / total * 100 : 0;
  return `<div class="st"><div class="sth">${ic(icn, 18)}<span>${label}</span><b>${total ? `${done}<small> из ${total}</small>` : `<small>—</small>`}</b></div>
    <div class="bar" aria-hidden="true"><i class="d" style="width:${pd}%"></i><i class="m" style="width:${pm}%"></i></div>
    ${extra ? `<div class="sx">${extra}</div>` : ""}</div>`;
}
function statsBlock(r) {
  const pressX = [r.pressMin ? `из них 10 мин: ${r.pressMin}` : "", r.ex ? `упражнений отмечено: ${r.ex}` : ""].filter(Boolean).join(", ");
  return statRow("code", "Python, дней", r.py, r.pyMin, r.days, r.pyMin ? `из них минимум: ${r.pyMin}` : "") +
    statRow("dumbbell", "Зал", r.gym, r.gymMin, r.gymPlan, r.gymMin ? `из них лёгкая: ${r.gymMin}` : "") +
    statRow("activity", "Пресс", r.press, r.pressMin, r.pressPlan, pressX) +
    statRow("monitorOff", "Отход от компьютера", r.off + r.offMin, r.offMin, r.days, r.offMin ? `вовремя: ${r.off}, до 23:45: ${r.offMin}` : "") +
    statRow("listChecks", "Пункты плана", r.bDone, 0, r.bTotal, r.bDays ? `дней с отметками: ${r.bDays}` : "");
}

function renderStats() {
  const we = addDays(weekStart, 6), tk = todayKey();
  const w = countPeriod(weekStart, we);
  const fmtW = weekStart.getMonth() === we.getMonth() ? `${weekStart.getDate()}–${we.getDate()} ${MONTHS[we.getMonth()]}`
    : `${weekStart.getDate()} ${MONTHS[weekStart.getMonth()]} – ${we.getDate()} ${MONTHS[we.getMonth()]}`;
  const mEnd = new Date(monthCur.getFullYear(), monthCur.getMonth() + 1, 0);
  const mo = countPeriod(monthCur, mEnd);

  let html = `<h1>Итоги</h1><p class="lead">Минимум считается. Пустые дни просто не отмечены. Серий и рейтингов нет.</p>`;
  html += `<div class="sec" style="margin-top:28px"><h2>Неделя</h2></div><div class="card pcard"><div class="pnav">
      <button class="nbtn" data-act="wprev" aria-label="Предыдущая неделя">${ic("chevL", 20)}</button><span>${fmtW}</span>
      <button class="nbtn" data-act="wnext" aria-label="Следующая неделя">${ic("chevR", 20)}</button></div>${statsBlock(w)}</div>`;
  html += `<div class="sec" style="margin-top:28px"><h2>Месяц</h2></div><div class="card pcard m"><div class="pnav">
      <button class="nbtn" data-act="mprev" aria-label="Предыдущий месяц">${ic("chevL", 20)}</button><span>${MONTHS_NOM[monthCur.getMonth()]} ${monthCur.getFullYear()}</span>
      <button class="nbtn" data-act="mnext" aria-label="Следующий месяц">${ic("chevR", 20)}</button></div>${statsBlock(mo)}
      <div class="cal">${WD_SHORT.map(x => `<span class="wd">${x}</span>`).join("")}`;
  for (let i = 0; i < wdIdx(monthCur); i++) html += `<span></span>`;
  for (let d = new Date(monthCur); d <= mEnd; d = addDays(d, 1)) {
    const k = keyOf(d), m = mark(k), p = planOf(k);
    const dot = (v, na) => `<i class="dot ${na ? "na" : v || ""}"></i>`;
    html += `<button class="cell ${k === tk ? "today" : ""} ${k > tk ? "future" : ""}" data-day="${k}" aria-label="${d.getDate()} ${MONTHS[d.getMonth()]}">
      <b>${d.getDate()}</b><span class="dots">${dot(m.py)}${dot(m.tr, p === "rest" && !m.tr)}${dot(m.off)}</span></button>`;
  }
  html += `</div><div class="legend"><span>Точки: Python · тренировка · отход</span>
      <span><i class="dot done"></i>да</span><span><i class="dot min"></i>минимум</span><span><i class="dot skip"></i>пропуск</span><span><i class="dot"></i>не отмечено</span></div>
      <p class="note-s" style="margin:10px 0 0">Нажми на день, чтобы открыть его отметки.</p></div>`;
  app.innerHTML = html;
}

function renderSettings() {
  const t = state.templates[edTpl];
  let html = `<h1>Настройки</h1>`;
  html += `<div class="sec" style="margin-top:24px"><h2>Шаблон на каждый день недели</h2></div><div class="card list">`;
  WD_FULL.forEach((n, i) => {
    const id = state.week[i];
    html += `<div class="wrow"><span>${n}</span><label class="wsel">${ic(TYPE_ICON[id] || "dot", 18, "acc")}<span>${esc(state.templates[id].name)}</span>${ic("chevD", 16, "mut")}
      <select data-wd="${i}" aria-label="${n}">${Object.entries(state.templates).map(([tid, x]) =>
        `<option value="${tid}" ${id === tid ? "selected" : ""}>${esc(x.name)}</option>`).join("")}</select></label></div>`;
  });
  html += `</div><p class="note-s">Разово поменять тип дня можно на экране «Сегодня», под датой.</p>`;

  html += `<div class="sec"><h2>Шаблоны дня</h2></div><div class="card tcard">
    <div class="seg">${Object.entries(state.templates).map(([id, x]) =>
      `<button data-tpl="${id}" aria-pressed="${id === edTpl}">${ic(TYPE_ICON[id] || "dot", 18)}${esc(x.name)}</button>`).join("")}</div>
    <div id="edlist" style="margin-top:6px">${t.blocks.map((b, i) => `<div class="trow" data-i="${i}">
      <div class="tm"><input type="time" value="${b.s}" data-f="s" aria-label="Начало"><span class="dash">–</span>
        <input type="time" value="${b.e}" data-f="e" aria-label="Конец">
        <button class="xs" data-act="del" data-i="${i}" aria-label="Удалить: ${esc(cleanTitle(b.t))}">${ic("x", 20)}</button></div>
      <input class="fld" type="text" value="${esc(cleanTitle(b.t))}" data-f="t" aria-label="Название"></div>`).join("")}</div>
    ${tplWarn ? `<div class="warn">${ic("info", 18)}<span>${esc(tplWarn)}</span></div>` : ""}
    <button class="dashed" data-act="add">${ic("plus", 18)}Добавить пункт</button>
    <div class="btn2"><button class="plain" data-act="resetTpl">Вернуть исходный</button><button class="ok" data-act="saveTpl">Сохранить</button></div>
    <p class="note-s" style="margin:10px 2px 2px">Время уведомлений меняется в Календаре iPhone: событие, «Изменить», «Сохранить для будущих событий».</p></div>`;

  html += `<div class="sec"><h2>Резервная копия</h2></div><div class="card bcard">
    <p>Отметки, заметки и программа хранятся только на этом телефоне. Раз в неделю сохраняй копию в «Файлы».</p>
    <button class="bigbtn" data-act="export">${ic("download", 20)}Сохранить копию</button>
    <button class="secbtn" data-act="import">${ic("upload", 18)}Восстановить из файла</button></div>`;
  html += `<p class="note-s" style="margin-top:18px">Уведомления приходят из Календаря iPhone, будильник из «Здоровья», раздел «Сон».</p>`;
  app.innerHTML = html;
}

function readEditor() {
  return [...document.querySelectorAll("#edlist .trow")].map(r => {
    const i = +r.dataset.i, old = state.templates[edTpl].blocks[i] || { id: uid(), h: "" };
    const v = f => r.querySelector(`[data-f="${f}"]`).value.trim();
    return Object.assign({}, old, { s: v("s"), e: v("e"), t: v("t") });
  });
}
function readExEditor(type) {
  return [...document.querySelectorAll("#exlist .edrow")].map(r => {
    const i = +r.dataset.i, old = state.programs[type].items[i] || { id: uid() };
    const v = f => r.querySelector(`[data-f="${f}"]`).value.trim();
    return Object.assign({}, old, { n: v("n"), t: v("t") });
  });
}
function checkBlocks(bl) {
  for (const b of bl) if (!/^\d\d:\d\d$/.test(b.s) || !/^\d\d:\d\d$/.test(b.e) || !b.t) return "У каждой строки должно быть время начала, конца и название.";
  const n = shiftMin;
  bl.sort((a, b) => n(a.s) - n(b.s));
  for (let i = 1; i < bl.length; i++) {
    let pe = n(bl[i - 1].e); if (pe <= n(bl[i - 1].s)) pe += 1440;
    if (n(bl[i].s) < pe) return `Пересекаются «${cleanTitle(bl[i - 1].t)}» и «${cleanTitle(bl[i].t)}». Сохранено, но проверь время.`;
  }
  return "";
}

async function shareText(text, title) {
  try {
    if (navigator.share) { await navigator.share({ text, title }); return; }
  } catch (e) { if (e.name === "AbortError") return; }
  try { await navigator.clipboard.writeText(text); toast("Отчёт скопирован"); }
  catch (e) { toast("Не удалось поделиться"); }
}
async function exportData() {
  const data = JSON.stringify({ app: "rezhim", version: 2, exported: new Date().toISOString(), ...state }, null, 1);
  const name = `rezhim-${todayKey()}.json`;
  const file = new File([data], name, { type: "application/json" });
  try {
    if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: name }); return; }
  } catch (e) { if (e.name === "AbortError") return; }
  const a = document.createElement("a");
  a.href = URL.createObjectURL(file); a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}

function toggleBlock(id) {
  const k = viewDay, plan = planOf(k), m = editMark(k);
  m.blocks = Object.assign({}, m.blocks);
  const st = m.blocks[id] = Object.assign({}, m.blocks[id]);
  st.d = !st.d;
  const b = blocksOf(k).find(x => x.id === id);
  if (st.d) {
    // пункт плана отмечает и связанную привычку, если она ещё пустая
    if (b && b.h && !m[b.h] && (b.h !== "tr" || HABITS.tr[plan])) {
      m[b.h] = m.light ? "min" : "done";
      if (m.plan === undefined) m.plan = plan;
    }
    popId = id;
    const nb = nextBlock(k, id);
    toast(b ? cleanTitle(b.t) : "Готово", nb ? `Дальше: ${nb.s} ${cleanTitle(nb.t)}` : "На сегодня всё");
  }
  save(); renderToday();
}
function toggleEx(id, type) {
  const k = viewDay, plan = planOf(k), m = editMark(k);
  m.ex = Object.assign({}, m.ex);
  const st = m.ex[id] = Object.assign({}, m.ex[id]);
  st.d = !st.d;
  if (st.d) popId = id;
  const items = state.programs[type].items;
  if (st.d && type === plan && !m.tr && items.every(x => m.ex[x.id]?.d)) {
    m.tr = m.light ? "min" : "done";
    m.plan = plan;
    toast("Тренировка засчитана", "Отмечено в привычках");
  }
  save(); renderTrain();
}

// ---------- события ----------
document.querySelector("nav.tabs").addEventListener("click", e => {
  const b = e.target.closest("button[data-tab]"); if (!b) return;
  if (b.dataset.tab !== tab && b.dataset.tab !== "stats" && (tab === "stats" || tab === "settings")) viewDay = todayKey();
  tab = b.dataset.tab; trEdit = false; openBlock = null; sheetOpen = false; tplWarn = "";
  render(); window.scrollTo(0, 0);
});

function goDay(k) { viewDay = k; openBlock = null; trType = null; trEdit = false; sheetOpen = false; render(); }

app.addEventListener("click", e => {
  const el = e.target.closest("button, [data-act]"); if (!el || el.disabled) return;
  const act = el.dataset.act;
  if (el.classList.contains("opt")) {
    const m = editMark(viewDay);
    m[el.dataset.h] = m[el.dataset.h] === el.dataset.v ? undefined : el.dataset.v;
    m.plan = planOf(viewDay);
    save(); renderToday(); return;
  }
  if (el.dataset.day) { tab = "today"; goDay(el.dataset.day); window.scrollTo(0, 0); return; }
  if (el.dataset.tpl) { edTpl = el.dataset.tpl; tplWarn = ""; renderSettings(); return; }
  if (el.dataset.prog) { trType = el.dataset.prog; trEdit = false; renderTrain(); return; }
  switch (act) {
    case "prev": goDay(keyOf(addDays(fromKey(viewDay), -1))); break;
    case "next": goDay(keyOf(addDays(fromKey(viewDay), 1))); break;
    case "today": goDay(todayKey()); break;
    case "yesterday": goDay(keyOf(addDays(fromKey(todayKey()), -1))); window.scrollTo(0, 0); break;
    case "blk": toggleBlock(el.dataset.id); break;
    case "open": openBlock = openBlock === el.dataset.id ? null : el.dataset.id; focusNote = !!openBlock; renderToday(); break;
    case "grp": {
      const key = `${viewDay}|${el.dataset.g}`;
      groupOpen[key] = el.getAttribute("aria-expanded") !== "true"; renderToday(); break;
    }
    case "goTrain": tab = "train"; render(); window.scrollTo(0, 0); break;
    case "light": { const m = editMark(viewDay); m.light = !m.light; save(); render(); break; }
    case "sheet": sheetOpen = true; render(); break;
    case "sheetClose": sheetOpen = false; render(); break;
    case "share": shareText(reportText(viewDay), "Отчёт дня"); break;
    case "ex": toggleEx(el.dataset.id, curProgType()); break;
    case "exedit": trEdit = true; renderTrain(); break;
    case "exstart": trEdit = true; state.programs[curProgType()].items.push({ id: uid(), n: "", t: "" }); renderTrain();
      { const inp = document.querySelector("#exlist .edrow:last-child input"); if (inp) inp.focus(); } break;
    case "excancel": trEdit = false; state.programs = load().programs; renderTrain(); break;
    case "exadd": case "exdel": case "exsave": {
      const type = curProgType();
      let items = readExEditor(type);
      if (act === "exadd") items.push({ id: uid(), n: "", t: "" });
      if (act === "exdel") items.splice(+el.dataset.i, 1);
      if (act === "exsave") { items = items.filter(x => x.n); trEdit = false; }
      state.programs[type].items = items;
      if (act === "exsave") { save(); toast("Программа сохранена"); }
      renderTrain();
      if (act === "exadd") { const inp = document.querySelector("#exlist .edrow:last-child input"); if (inp) inp.focus(); }
      break;
    }
    case "wprev": weekStart = addDays(weekStart, -7); renderStats(); break;
    case "wnext": weekStart = addDays(weekStart, 7); renderStats(); break;
    case "mprev": monthCur = new Date(monthCur.getFullYear(), monthCur.getMonth() - 1, 1); renderStats(); break;
    case "mnext": monthCur = new Date(monthCur.getFullYear(), monthCur.getMonth() + 1, 1); renderStats(); break;
    case "add": {
      const bl = readEditor(); bl.push({ id: uid(), s: "", e: "", t: "", h: "" });
      state.templates[edTpl].blocks = bl; renderSettings();
      const inputs = document.querySelectorAll("#edlist .trow:last-child input"); if (inputs[0]) inputs[0].focus();
      break;
    }
    case "del": {
      const bl = readEditor(); bl.splice(+el.dataset.i, 1);
      state.templates[edTpl].blocks = bl; renderSettings(); break;
    }
    case "saveTpl": {
      const bl = readEditor().filter(b => b.s || b.e || b.t);
      const w = checkBlocks(bl);
      tplWarn = w;
      if (w.startsWith("У каждой")) { renderSettings(); break; }
      state.templates[edTpl].blocks = bl; save(); renderSettings(); if (!w) toast("Шаблон сохранён");
      break;
    }
    case "resetTpl":
      if (confirm(`Вернуть шаблон «${state.templates[edTpl].name}» к исходному?`)) {
        state.templates[edTpl] = clone(DEFAULT_TEMPLATES[edTpl]); tplWarn = ""; save(); renderSettings(); toast("Шаблон восстановлен");
      }
      break;
    case "export": exportData(); break;
    case "import": document.getElementById("importFile").click(); break;
  }
});

// заметки сохраняются по мере набора, без перерисовки
app.addEventListener("input", e => {
  const key = e.target.dataset.note; if (key === undefined) return;
  const [kind, id] = key.split(":"), m = editMark(viewDay), val = e.target.value;
  if (kind === "d") m.note = val;
  else {
    const f = kind === "b" ? "blocks" : "ex";
    m[f] = Object.assign({}, m[f]);
    m[f][id] = Object.assign({}, m[f][id], { n: val });
  }
  saveSoon();
});

app.addEventListener("change", e => {
  if (e.target.id === "planSel") {
    const m = editMark(viewDay);
    m.plan = e.target.value;
    if (m.plan === "rest") delete m.tr;
    trType = null; save(); render(); return;
  }
  if (e.target.dataset.wd !== undefined) {
    state.week[+e.target.dataset.wd] = e.target.value; save(); renderSettings(); toast("Сохранено");
  }
});

document.getElementById("importFile").addEventListener("change", async e => {
  const f = e.target.files[0]; e.target.value = ""; if (!f) return;
  try {
    const d = JSON.parse(await f.text());
    if (d.app !== "rezhim" || typeof d.marks !== "object") throw new Error("bad");
    if (!confirm("Заменить текущие данные данными из файла?")) return;
    localStorage.setItem(KEY, JSON.stringify({ marks: d.marks, templates: d.templates, week: d.week, programs: d.programs }));
    state = load(); render(); toast("Восстановлено");
  } catch (err) { toast("Это не файл копии «Режима»"); }
});

// при возвращении в приложение после 05:00 — показать новый день
let lastToday = todayKey();
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState !== "visible") { save(); return; }
  const tk = todayKey();
  if (tk !== lastToday) { if (viewDay === lastToday) viewDay = tk; lastToday = tk; }
  if (!document.activeElement.matches("input,textarea,select")) render();
});
setInterval(() => {
  if (tab === "today" && !sheetOpen && document.visibilityState === "visible" && !document.activeElement.matches("input,textarea,select")) renderToday();
}, 60000);

render();

// новая версия с GitHub: перезагрузиться один раз, как только она установилась
if ("serviceWorker" in navigator && location.protocol !== "file:") {
  const hadController = !!navigator.serviceWorker.controller;
  let reloaded = false;
  navigator.serviceWorker.addEventListener("controllerchange", () => {
    if (!hadController || reloaded) return;
    reloaded = true; save(); location.reload();
  });
  navigator.serviceWorker.register("sw.js").then(r => r.update()).catch(() => {});
}
</script>
